<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Member login Page </title>
  <link href="login_member.css" rel="stylesheet" type="text/css">
  <script type="login_m_val"> </script>
  

</head>

<body>
  <div class="loginbox">
    <h1>Member Registration </h1><br><br>
    <form action="login_p.php" id="form_id" method="post" name="myform">
      
      <p type="text_em" style="color: white;font-size: 24px;">UserName</p>
      <input type="text" name="UserName" class = "userName" placeholder="Enter your UserName" required >
      <p type="text_em" style="color: white;font-size: 24px;">Email Id</p>
      <input type="email"  pattern="[^ @]*@[^ @]" name="email" placeholder="Enter your Email" required id="email">
      <p type="text_pa" style="color: white;font-size: 24px;">Password</p>
      <input type="password" name="password" placeholder="Password" required id="password">
      <input type="button" value="Login" id="submit" onclick="validate()" /><br>
      <a href="login_member.html" style="font-size: 20px;">Go to login</a>
    </form>
  </div>
  <script src="memberLogin.js"></script>
  
  </body>


</html>
